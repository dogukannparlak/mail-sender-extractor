<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mail Temizleyici</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #d64545;
    --accent-dark: #b83838;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --border: #3a3a3c;
      --text: #f2f2f7;
      --muted: #a1a1a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; }
  .summary { color: var(--muted); font-size: 14px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 32px 80px; }
  .sender-list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .sender-item { border-top: 1px solid var(--border); }
  .sender-item:first-child { border-top: none; }
  .sender-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    font-size: 14px;
  }
  .sender-preview { display: none; padding: 2px 18px 12px 47px; }
  .sender-preview.open { display: block; }
  .preview-item { padding: 6px 0; border-top: 1px dashed var(--border); }
  .preview-item:first-child { border-top: none; }
  .preview-subject {
    font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview-snippet {
    color: var(--muted); font-size: 12px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .preview-date { color: var(--muted); }
  .preview-loading, .preview-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .sender-row:first-child { border-top: none; }
  .sender-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sender-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sender-email { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sender-count { color: var(--muted); font-size: 13px; min-width: 40px; text-align: right; }
  input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .unsub-btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    white-space: nowrap;
  }
  .unsub-btn:hover { background: rgba(214,69,69,0.1); }
  .unsub-btn:disabled { border-color: var(--border); color: var(--muted); background: none; }
  .unsub-result { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .copy-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    white-space: nowrap;
  }
  .copy-btn:hover { background: rgba(128,128,128,0.1); }
  .preview-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    white-space: nowrap;
  }
  .preview-btn:hover { background: rgba(128,128,128,0.1); }
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    justify-content: center;
    gap: 16px;
    align-items: center;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #selectedInfo { font-size: 14px; color: var(--muted); }
  #status {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 32px 100px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .note {
    background: rgba(214,69,69,0.08);
    border: 1px solid rgba(214,69,69,0.3);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  #scanBtn { padding: 8px 16px; font-size: 13px; }
  #status progress { width: 100%; height: 10px; accent-color: var(--accent); }
  .empty-state { color: var(--muted); }
  .error-state { color: var(--accent); }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .toolbar-spacer { flex: 1; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; margin-left: 6px;
    border-radius: 10px; border: 1px solid var(--border); color: var(--muted); vertical-align: 1px;
  }
  .badge-bulten { color: #2f6fd6; border-color: rgba(47,111,214,0.4); }
  .badge-promosyon { color: #c2410c; border-color: rgba(194,65,12,0.4); }
  .badge-bildirim { color: #6d28d9; border-color: rgba(109,40,217,0.4); }
  .badge-kisisel { color: #15803d; border-color: rgba(21,128,61,0.4); }
  .select-all { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .action-bar select, .toolbar select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Mail Temizleyici</h1>
  <span class="summary" id="grandTotal"></span>
  <button id="scanBtn" type="button">Gelen Kutusunu Tara</button>
</header>

<main>
  <div class="note">
    Seçtiğin gönderenlerden gelen mailler <strong>kalıcı olarak silinmez</strong>, Gmail'in
    Çöp Kutusu'na taşınır. Gmail 30 gün sonra çöp kutusunu otomatik boşaltır, o zamana kadar geri alabilirsin.
  </div>
  <div class="toolbar">
    <label class="select-all"><input type="checkbox" id="selectAll"> Tümünü seç</label>
    <span class="toolbar-spacer"></span>
    <span id="categoryFilterWrap" hidden>
      <label for="categorySelect">Kategori:</label>
      <select id="categorySelect">
        <option value="">Tümü</option>
        <option value="bulten">Bülten</option>
        <option value="promosyon">Promosyon</option>
        <option value="bildirim">Bildirim</option>
        <option value="kisisel">Kişisel</option>
      </select>
    </span>
    <label for="viewSelect">Görünüm:</label>
    <select id="viewSelect">
      <option value="address">Adres</option>
      <option value="domain">Alan adı</option>
    </select>
    <label for="sortSelect">Sırala:</label>
    <select id="sortSelect">
      <option value="count_desc">Mail sayısı (çoktan aza)</option>
      <option value="count_asc">Mail sayısı (azdan çoğa)</option>
      <option value="name_asc">İsme göre (A-Z)</option>
      <option value="name_desc">İsme göre (Z-A)</option>
    </select>
  </div>
  <div id="senders">Yükleniyor...</div>
</main>

<div id="status"></div>

<div class="action-bar">
  <span id="selectedInfo">0 mail seçildi</span>
  <select id="scopeSelect" title="Silme ve önizleme hangi mailleri kapsasın?">
    <option value="inbox">Yalnız gelen kutusu</option>
    <option value="all">Tüm mailler (arşiv dahil)</option>
  </select>
  <button id="unsubBtn" disabled>Seçilenlerin Aboneliğinden Çık</button>
  <button id="deleteBtn" disabled>Seçilenleri Çöpe Taşı</button>
</div>

<script>
let data = null;
let sortMode = 'count_desc';
let scope = 'inbox';
let viewMode = 'address';
let categoryFilter = '';
const CATEGORY_LABELS = { bulten: 'Bülten', promosyon: 'Promosyon', bildirim: 'Bildirim', kisisel: 'Kişisel' };

function passesFilters(g) {
  if (categoryFilter && g.kategori !== categoryFilter) return false;
  return true;
}
// Seçim DOM'da değil burada tutulur; liste yeniden çizilince (sıralama, görünüm) kaybolmasın.
const selected = new Set();

function domainOf(address) {
  const at = address.lastIndexOf('@');
  return at === -1 ? address : address.slice(at + 1);
}

// Ekrandaki satırlar: adres görünümünde gönderen başına, alan adı görünümünde alan adı başına bir satır.
function buildRows() {
  const visible = data.gonderenler.filter(passesFilters);
  if (viewMode === 'address') {
    return visible.map(g => ({
      key: g.gonderen,
      label: g.ad || g.gonderen,
      sub: g.ad ? g.gonderen : '',
      count: g.mail_sayisi,
      members: [g],
    }));
  }
  const groups = new Map();
  visible.forEach(g => {
    const domain = domainOf(g.gonderen);
    if (!groups.has(domain)) groups.set(domain, []);
    groups.get(domain).push(g);
  });
  return [...groups].map(([domain, members]) => ({
    key: '@' + domain,
    label: domain,
    sub: `${members.length} adres`,
    count: members.reduce((sum, g) => sum + g.mail_sayisi, 0),
    members,
  }));
}

function sortedRows() {
  const rows = buildRows();
  rows.sort((a, b) => {
    if (sortMode === 'name_asc') return a.label.localeCompare(b.label, 'tr');
    if (sortMode === 'name_desc') return b.label.localeCompare(a.label, 'tr');
    const diff = a.count - b.count;
    return sortMode === 'count_asc' ? diff : -diff;
  });
  return rows;
}

// textContent → innerHTML yöntemi tırnakları kaçırmaz; değer attribute içine
// (title="...") girdiğinde gönderen adı yeni attribute açabilirdi.
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, ch => HTML_ESCAPES[ch]);
}

async function copyToClipboard(text, btnEl) {
  const originalText = btnEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btnEl.textContent = 'Kopyalandı!';
  } catch (err) {
    btnEl.textContent = 'Kopyalanamadı';
  } finally {
    setTimeout(() => { btnEl.textContent = originalText; }, 1500);
  }
}

async function load() {
  try {
    const res = await fetch('/api/senders');
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `Sunucu hatası (${res.status})`);
    setData(body);
  } catch (err) {
    document.getElementById('senders').innerHTML =
      `<p class="error-state">Gönderenler yüklenemedi: ${escapeHtml(err.message)}</p>`;
  }
}

function setData(body) {
  data = body;
  const known = new Set(data.gonderenler.map(g => g.gonderen));
  [...selected].forEach(key => { if (!known.has(key)) selected.delete(key); });
  render();
}

function render() {
  document.getElementById('grandTotal').textContent =
    `Toplam ${data.toplam_mail_sayisi} mail, ${data.gonderenler.length} gönderen`;

  const container = document.getElementById('senders');
  container.innerHTML = '';

  if (!data.gonderenler.length) {
    container.innerHTML =
      '<p class="empty-state">Henüz veri yok. Yukarıdaki "Gelen Kutusunu Tara" butonuna ' +
      'basarak başlayabilirsin.</p>';
    updateSelection();
    return;
  }

  // Kategori yalnız yeni taramada toplanır; eski kayıtta filtreyi gösterme.
  document.getElementById('categoryFilterWrap').hidden = !data.gonderenler.some(g => g.kategori);

  const rows = sortedRows();
  if (!rows.length) {
    container.innerHTML = '<p class="empty-state">Filtreye uyan gönderen yok.</p>';
    syncSelectAll();
    updateSelection();
    return;
  }

  const list = document.createElement('div');
  list.className = 'sender-list';

  rows.forEach(rowData => {
    const item = document.createElement('div');
    item.className = 'sender-item';
    const single = rowData.members.length === 1 && viewMode === 'address';
    const g = rowData.members[0];

    const row = document.createElement('div');
    row.className = 'sender-row';
    const title = single && g.ad ? `${g.ad} <${g.gonderen}>` : rowData.key;
    row.innerHTML = `
      <input type="checkbox" class="sender-checkbox">
      <div class="sender-info" title="${escapeHtml(title)}">
        <span class="sender-name">${escapeHtml(rowData.label)}${single && CATEGORY_LABELS[g.kategori]
          ? ` <span class="badge badge-${g.kategori}">${CATEGORY_LABELS[g.kategori]}</span>` : ''}</span>
        ${rowData.sub ? `<span class="sender-email">${escapeHtml(rowData.sub)}</span>` : ''}
      </div>
      <span class="sender-count">${rowData.count}</span>
      <button class="preview-btn" type="button">${single ? 'Önizle' : 'Adresler'}</button>
      <button class="copy-btn" type="button" title="${single ? 'E-posta adresini' : 'Alan adını'} kopyala">Kopyala</button>
      ${single ? '<button class="unsub-btn" type="button">Çık</button><span class="unsub-result"></span>' : ''}
    `;

    const previewPanel = document.createElement('div');
    previewPanel.className = 'sender-preview';

    const checkbox = row.querySelector('.sender-checkbox');
    checkbox.rowMembers = rowData.members;
    syncRowCheckbox(checkbox);
    checkbox.addEventListener('change', () => {
      rowData.members.forEach(m => checkbox.checked ? selected.add(m.gonderen) : selected.delete(m.gonderen));
      syncSelectAll();
      updateSelection();
    });
    row.querySelector('.preview-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (single) togglePreview(g.gonderen, previewPanel, e.target);
      else toggleMembers(rowData.members, previewPanel, e.target);
    });
    row.querySelector('.copy-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(single ? g.gonderen : domainOf(g.gonderen), e.target);
    });
    if (single) {
      row.querySelector('.unsub-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        runUnsubscribe([g.gonderen], row.querySelector('.unsub-result'), e.target);
      });
    }

    item.appendChild(row);
    item.appendChild(previewPanel);
    list.appendChild(item);
  });

  container.appendChild(list);
  syncSelectAll();
  updateSelection();
}

function syncRowCheckbox(checkbox) {
  const picked = checkbox.rowMembers.filter(m => selected.has(m.gonderen)).length;
  checkbox.checked = picked === checkbox.rowMembers.length;
  checkbox.indeterminate = picked > 0 && !checkbox.checked;
}

function toggleMembers(members, panel, btnEl) {
  const open = panel.classList.toggle('open');
  btnEl.textContent = open ? 'Gizle' : 'Adresler';
  if (!open) return;
  panel.innerHTML = members
    .slice().sort((a, b) => b.mail_sayisi - a.mail_sayisi)
    .map(m => `
      <div class="preview-item">
        <div class="preview-subject">${escapeHtml(m.gonderen)} · ${m.mail_sayisi} mail</div>
        ${m.ad ? `<div class="preview-snippet">${escapeHtml(m.ad)}</div>` : ''}
      </div>
    `).join('');
}

function formatDate(ms) {
  if (!ms) return '';
  return new Date(Number(ms)).toLocaleDateString('tr-TR',
    { day: 'numeric', month: 'short', year: 'numeric' });
}

async function togglePreview(sender, panel, btnEl) {
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    btnEl.textContent = 'Önizle';
    return;
  }
  panel.classList.add('open');
  btnEl.textContent = 'Gizle';
  if (panel.dataset.loaded === '1') return;  // bir kez yükle, tekrar açılınca cache'ten göster

  panel.innerHTML = '<div class="preview-loading">Yükleniyor...</div>';
  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender, scope })
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `Sunucu hatası (${res.status})`);

    if (!body.previews.length) {
      panel.innerHTML = '<div class="preview-empty">Bu gönderenden mail bulunamadı.</div>';
    } else {
      panel.innerHTML = body.previews.map(p => `
        <div class="preview-item">
          <div class="preview-subject">${escapeHtml(p.subject)}</div>
          <div class="preview-snippet"><span class="preview-date">${formatDate(p.date)}</span>${p.snippet ? ' — ' + escapeHtml(p.snippet) : ''}</div>
        </div>
      `).join('');
    }
    panel.dataset.loaded = '1';
  } catch (err) {
    panel.innerHTML = `<div class="error-state">Önizleme yüklenemedi: ${escapeHtml(err.message)}</div>`;
  }
}

function syncSelectAll() {
  const boxes = [...document.querySelectorAll('.sender-checkbox')];
  const selectAll = document.getElementById('selectAll');
  selectAll.checked = boxes.length > 0 && boxes.every(b => b.checked);
  selectAll.indeterminate = boxes.some(b => b.checked || b.indeterminate) && !selectAll.checked;
}

function getSelected() {
  return data ? data.gonderenler.filter(g => selected.has(g.gonderen)) : [];
}

function updateSelection() {
  const picked = getSelected();
  const totalMail = picked.reduce((sum, g) => sum + g.mail_sayisi, 0);
  document.getElementById('selectedInfo').textContent =
    picked.length ? `${picked.length} gönderen, ${totalMail} mail seçildi` : '0 mail seçildi';
  document.getElementById('deleteBtn').disabled = picked.length === 0;
  document.getElementById('unsubBtn').disabled = picked.length === 0;
}

function describeUnsubResult(r) {
  if (r.status === 'done') return `✅ otomatik çıkıldı`;
  if (r.status === 'manual_link') return `🔗 link: ${r.url}`;
  if (r.status === 'manual_mailto') return `✉️ mail gönder: ${r.url}`;
  if (r.status === 'not_found') return `– mail bulunamadı`;
  return `– abonelik linki yok`;
}

// Link, fetch'ten sonra window.open ile açılırsa popup engelleyicisine takılır;
// bunun yerine kullanıcının tıklayacağı bir bağlantı gösteriyoruz.
function showUnsubResult(resultEl, r) {
  resultEl.textContent = '';
  const isLink = (r.status === 'manual_link' || r.status === 'manual_mailto') &&
    /^(https?:|mailto:)/i.test(r.url || '');
  if (!isLink) {
    resultEl.textContent = describeUnsubResult(r);
    return;
  }
  const a = document.createElement('a');
  a.href = r.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = r.status === 'manual_link' ? '🔗 Çıkış sayfasını aç' : '✉️ Çıkış maili gönder';
  resultEl.appendChild(a);
}

async function runUnsubscribe(senders, resultEl, btnEl) {
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '...'; }
  try {
    const res = await fetch('/api/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senders })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Sunucu hatası (${res.status})`);
    if (resultEl) showUnsubResult(resultEl, data.results[0]);
    return data.results;
  } catch (err) {
    if (resultEl) {
      resultEl.textContent = `Hata: ${err.message}`;
      return [];
    }
    throw err;
  } finally {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Çık'; }
  }
}

function setActionButtonsDisabled(disabled) {
  document.getElementById('unsubBtn').disabled = disabled;
  document.getElementById('deleteBtn').disabled = disabled;
}

function showScanProgress(state) {
  const pct = state.total ? Math.floor(state.processed / state.total * 100) : 0;
  document.getElementById('scanBtn').textContent = state.total ? `Taranıyor %${pct}` : 'Taranıyor...';
  const status = document.getElementById('status');
  status.innerHTML = state.total
    ? `<progress max="${state.total}" value="${state.processed}"></progress>
       <div>${state.processed} / ${state.total} mail tarandı (%${pct})</div>`
    : 'Gelen kutusundaki mailler listeleniyor...';
}

// Tarama sunucuda arka planda sürer; bitene kadar durumu yokla.
async function pollScan() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  setActionButtonsDisabled(true);
  try {
    while (true) {
      const res = await fetch('/api/scan/status');
      const state = await res.json();
      if (!res.ok) throw new Error(state.error || `Sunucu hatası (${res.status})`);
      if (!state.running) {
        if (state.error) throw new Error(state.error);
        await load();
        document.getElementById('status').textContent =
          `Tarama tamamlandı. Toplam ${data.toplam_mail_sayisi} mail, ${data.gonderenler.length} gönderen.`;
        return;
      }
      showScanProgress(state);
      await new Promise(r => setTimeout(r, 700));
    }
  } catch (err) {
    document.getElementById('status').textContent = 'Tarama sırasında hata oluştu: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Gelen Kutusunu Tara';
    updateSelection();
  }
}

async function scanInbox() {
  try {
    const res = await fetch('/api/scan', { method: 'POST' });
    const result = await res.json();
    // 409: başka bir sekmede başlamış tarama; onu izlemeye devam et.
    if (!res.ok && res.status !== 409) throw new Error(result.error || `Sunucu hatası (${res.status})`);
    showScanProgress(result);
    await pollScan();
  } catch (err) {
    document.getElementById('status').textContent = 'Tarama başlatılamadı: ' + err.message;
  }
}

async function resumeScanIfRunning() {
  try {
    const res = await fetch('/api/scan/status');
    const state = await res.json();
    if (res.ok && state.running) pollScan();
  } catch (err) { /* durum alınamazsa sayfa normal açılır */ }
}

document.getElementById('scanBtn').addEventListener('click', scanInbox);

document.getElementById('sortSelect').addEventListener('change', (e) => {
  sortMode = e.target.value;
  if (data) render();
});

document.getElementById('scopeSelect').addEventListener('change', (e) => {
  scope = e.target.value;
  if (data) render();  // açık önizlemeler eski kapsamla yüklendi; kapatıp yeniden yükletelim
});

document.getElementById('categorySelect').addEventListener('change', (e) => {
  categoryFilter = e.target.value;
  if (data) render();
});

document.getElementById('viewSelect').addEventListener('change', (e) => {
  viewMode = e.target.value;
  if (data) render();
});

// Yalnız ekranda görünen satırları seçer/bırakır.
document.getElementById('selectAll').addEventListener('change', (e) => {
  const checked = e.target.checked;
  document.querySelectorAll('.sender-checkbox').forEach(cb => {
    cb.rowMembers.forEach(m => checked ? selected.add(m.gonderen) : selected.delete(m.gonderen));
    syncRowCheckbox(cb);
  });
  updateSelection();
});

document.getElementById('unsubBtn').addEventListener('click', async () => {
  const selected = getSelected();
  const btn = document.getElementById('unsubBtn');
  btn.disabled = true;
  btn.textContent = 'İşleniyor...';
  document.getElementById('status').textContent = `${selected.length} gönderen için abonelik bilgisi kontrol ediliyor...`;

  try {
    const results = await runUnsubscribe(selected.map(g => g.gonderen), null, null);
    const lines = results.map(r => `- ${r.sender}: ${describeUnsubResult(r)}`);
    document.getElementById('status').textContent =
      'Abonelik işlemi tamamlandı:\n\n' + lines.join('\n') +
      '\n\n🔗 ve ✉️ ile işaretlenenler için gönderen satırındaki "Çık" butonuna bas; satırda tıklanabilir link çıkar.';
  } catch (err) {
    document.getElementById('status').textContent = 'Hata oluştu: ' + err.message;
  } finally {
    btn.textContent = 'Seçilenlerin Aboneliğinden Çık';
    updateSelection();
  }
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  const selected = getSelected();
  const senders = selected.map(g => g.gonderen);
  const btn = document.getElementById('deleteBtn');
  btn.disabled = true;

  try {
    // Taramadaki sayı yalnız gelen kutusunu sayar; onayda seçilen kapsamın gerçek sayısı görünsün.
    btn.textContent = 'Sayılıyor...';
    const countRes = await fetch('/api/count', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senders, scope })
    });
    const count = await countRes.json();
    if (!countRes.ok) throw new Error(count.error || `Sunucu hatası (${countRes.status})`);

    const scopeText = scope === 'all' ? 'tüm maillerde (arşiv dahil)' : 'gelen kutusunda';
    const ok = confirm(
      `${selected.length} gönderenden ${scopeText} bulunan ${count.total} mail Çöp Kutusu'na taşınacak.\n\nDevam edilsin mi?`
    );
    if (!ok) return;

    btn.textContent = 'Taşınıyor...';
    document.getElementById('status').textContent = 'İşlem sürüyor, tarayıcı sekmesini kapatma...';

    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senders, scope })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || `Sunucu hatası (${res.status})`);

    const removed = new Set(result.details.map(d => d.sender));
    const remaining = data.gonderenler.filter(g => !removed.has(g.gonderen));
    setData({
      toplam_mail_sayisi: remaining.reduce((sum, g) => sum + g.mail_sayisi, 0),
      gonderenler: remaining,
    });

    const lines = result.details.map(d => `- ${d.sender}: ${d.deleted} mail çöpe taşındı`);
    document.getElementById('status').textContent =
      `Tamamlandı. Toplam ${result.total_deleted} mail çöpe taşındı.\n\n` + lines.join('\n');
  } catch (err) {
    document.getElementById('status').textContent = 'Hata oluştu: ' + err.message;
  } finally {
    btn.textContent = 'Seçilenleri Çöpe Taşı';
    updateSelection();
  }
});

load().then(resumeScanIfRunning);
</script>
</body>
</html>
